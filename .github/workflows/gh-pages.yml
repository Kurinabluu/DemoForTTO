name: Deploy gh-pages

on:
  push:
    branches:
      - viewDemo
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync content data (split + fallback JSON)
        run: npm run data:sync

      - name: Scan location catalog (report missing towns)
        run: npm run catalog:scan
        continue-on-error: true

      - name: Verify cloud API variable
        env:
          CLOUD_API_BASE_URL: ${{ vars.TTO_API_BASE_URL || secrets.TTO_API_BASE_URL }}
        run: |
          if [ -z "$CLOUD_API_BASE_URL" ]; then
            echo "Missing GitHub repository variable or secret: TTO_API_BASE_URL"
            exit 1
          fi

      - name: Build production bundle
        run: npm run build
        env:
          VITE_USE_API: 'true'
          VITE_USE_LOCAL_JSON_FALLBACK: 'false'
          VITE_API_BASE_URL: ${{ vars.TTO_API_BASE_URL || secrets.TTO_API_BASE_URL }}
          VITE_APP_BASE: /DemoForTTO/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: vue-pages
